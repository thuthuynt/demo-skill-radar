hiên bản mới của bia TAB 100. TAB 100 Gold sở hữu hương vị cao cấp hơn và đậm đà hơn cả, chinh phục người tiêu dùng với trải nghiệm uống hoàn hảo.\r\nBia Super Cap: là thương hiệu mang tính đột phá kết hợp giữa tinh hoa nguyên liệu hảo hạng và công nghệ bay hơi chân không Schoko độc quyền mang đến trải nghiệm khác biệt bởi sự êm mát tinh khiết và bùng nổ sảng khoái đến bất ngờ.\r\nBia NAVY: là dòng bia hơi mới nhất được ra mắt vào năm 2024 nhưng đã gây được ấn tượng mạnh trong lòng người tiêu dùng với hương vị đậm đà, sảng khoái.\r\nMang khát vọng cung ứng những ly bia chất lượng tiêu chuẩn châu Âu cho người tiêu dùng Việt, Barett hướng đến tầm nhìn trở thành công ty hàng đầu trong lĩnh vực sản xuất và phân phối bia có sự đầu tư mạnh mẽ về mặt công nghệ và nguyên liệu. Sở hữu nhà máy tiên phong công nghệ 4.0 - Barett Smart Factory, toạ lạc ngay tại vị trí giao thông huyết mạch tỉnh Hưng Yên. Đây đồng thời là nhà máy bia và đồ uống giải khát đầu tiên tại Việt Nam đạt chứng chỉ LEED do Hội đồng Công trình Xanh Hoa Kỳ (USGBC) công nhận.\r\n\r\nVới tầm nhìn và sứ mệnh trên, Barett luôn nỗ lực xây dựng môi trường làm việc và tìm kiếm nguồn nhân lực nhiệt huyết, trẻ trung và không ngừng học hỏi để mang đến những sáng tạo, đột phá mới nhằm nâng cao chất lượng dịch vụ và sản phẩm. Chúng tôi mong muốn mỗi thành viên của ngôi nhà chung Barett đều làm việc hạnh phúc và hiệu quả mỗi ngày, phát huy tốt nhất giá trị và tiềm năng của bản thân cho công ty, cộng đồng và xã hội."])</script><script>self.__next_f.push([1,"24:Tbc2,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong\u003e1. Quản trị hoạt động các nhóm hỗ trợ\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e- Quản lý và điều phối Admin, Technical, Taskforce, PG theo kế hoạch kinh doanh.\u003c/p\u003e\u003cp\u003e- Thiết lập mục tiêu, đầu việc, KPI và nhịp báo cáo cho từng nhóm.\u003c/p\u003e\u003cp\u003e- Theo dõi tiến độ, xử lý điểm nghẽn và bảo đảm phối hợp với Sales/ASM/ĐL.\u003c/p\u003e\u003cp\u003e\u003c  nhận.\r\n\r\nVới tầm nhìn và sứ mệnh trên, Barett luôn nỗ lực xây dựng môi trường làm việc và tìm kiếm nguồn nhân lực nhiệt huyết, trẻ trung và không ngừng học hỏi để mang đến những sáng tạo, đột phá mới nhằm nâng cao chất lượng dịch vụ và sản phẩm. Chúng tôi mong muốn mỗi thành viên của ngôi nhà chung Barett đều làm việc hạnh phúc và hiệu quả mỗi ngày, phát huy tốt nhất giá trị và tiềm năng của bản thân cho công ty, cộng đồng và xã hội."])</script><script>self.__next_f.push([1,"44:{\"companyId\":326893,\"jobImageURLs\":\"$45\",\"jobVideoURLs\":\"$46\",\"companyName\":\"Công ty Cổ phần thực phẩm và đồ uống Barett (Barett Smart Factory)\",\"companyLogoURL\":\"https://images.vietnamworks.com/pictureofcompany/6b/11048177.png\",\"companySizeId\":\"\",\"companyProfile\":\"$47\",\"contactName\":\"\",\"contactEmail\":\"\",\"website\":\"\",\"address\":\"22 Phố Thể Giao, Lê Đại Hành, Hai Bà Trưng, Hà Nội, Việt Nam\",\"allowRedirect\":0,\"whyWorkWithUs\":\"\",\"profileBaseName\":\"\",\"isUpgradeProfile\":0,\"isDeleteProfile\":0,\"isAllowUserEdit\":0,\"companyProfileBannerUrl\":\"\",\"companyProfileUrl\":\"\",\"allowRedirectJobIds\":\"\",\"profilePublishedSiteMask\":0,\"bannerDesktopUri\":\"https://images.vietnamworks.com/pictureofcompany/bb/company-info-cover-picture-url-326893-1747898343.png\"}\n48:{\"value\":\"null\",\"badge\":\"\",\"color\":\"\"}\n4a:{\"serviceCode\":\"JPM\",\"startOn\":\"2026-09-12T08:47:32+07:00\",\"expiredOn\":\"2026-10-12T23:59:59+07:00\"}\n49:[\"$4a\"]\n4b:{\"jobInvitationId\":0,\"status\":0}\n4c:[\"no_tp\"]\n"])</script><script>self.__next_f.push([1,"28:{\"jobId\":2106216,\"jobTitle\":\"Quản lý vận hành kinh doanh (SOM)\",\"userId\":6298946,\"companyLogo\":\"https://images.vietnamworks.com/pictureofcompany/6b/11048177.png\",\"alias\":\"quan-ly-van-hanh-kinh-doanh-som\",\"createdOn\":\"2026-09-12T08:46:56+07:00\",\"approvedOn\":\"2026-09-12T08:47:32+07:00\",\"approvedOnText\":\"Đăng 1 tháng trước\",\"approvedOnTextColor\":\"#333333\",\"expiredOn\":\"
